spring:
  datasource:
    url: jdbc:h2:mem:voyage_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-jwt-secret-must-be-long-enough-for-hs256-algorithm
    access-token-minutes: 120
  cors:
    allowed-origins: http://localhost:5173
