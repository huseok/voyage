# profile=cloud：远程 PostgreSQL。连接串与账号务必用环境变量注入，勿在仓库写死生产库。
# 未设置环境变量时的占位默认指向本机 5432（便于与自建库对齐）；云上 RDS 请显式配置 SPRING_DATASOURCE_*。
# 说明见 DEPLOY.md、本仓库 deploy/aliyun/README.md、DEPLOY_STEP_BY_STEP.md。
spring:
  datasource:
    # url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0&preferQueryMode=simple}
    # username: ${SPRING_DATASOURCE_USERNAME:postgres.xufviqcdhpncrdkyelrd}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/voyage_db?sslmode=prefer}
    username: ${SPRING_DATASOURCE_USERNAME:voyage_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    # 云库 public 常有既有对象；可用环境变量覆盖
    baseline-on-migrate: true
    baseline-version: "0"
