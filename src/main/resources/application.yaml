# 公共 Spring 配置；默认 cloud；本地库见 application-local.yaml（由 SPRING_PROFILES_ACTIVE=local 激活）。
server:
  port: 8080

spring:
  application:
    name: voyage

  servlet:
    multipart:
      # 须大于 voyage.media.max-upload-bytes，预留 multipart 封装开销
      max-file-size: 15MB
      max-request-size: 15MB

  profiles:
    default: cloud

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: info
    com.trioForce.voyage: debug
    org.springframework.web: info
    org.hibernate.SQL: debug

voyage:
  snowflake:
    worker-id: ${VOYAGE_SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${VOYAGE_SNOWFLAKE_DATACENTER_ID:1}
  storefront:
    # 首页活动商品轮播使用的标签编码（覆盖环境变量 VOYAGE_STOREFRONT_HOME_PROMO_ZONE_TAG_CODE）
    home-promo-zone-tag-code: ${VOYAGE_STOREFRONT_HOME_PROMO_ZONE_TAG_CODE:HOME_PROMO}
    home-featured-tag-code: ${VOYAGE_STOREFRONT_HOME_FEATURED_TAG_CODE:}
    home-hot-tag-code: ${VOYAGE_STOREFRONT_HOME_HOT_TAG_CODE:}
  media:
    # 上传文件落盘目录（生产请改为绝对路径并确保进程可写）
    storage-root: ${VOYAGE_MEDIA_STORAGE_ROOT:./data/media}
    max-upload-bytes: ${VOYAGE_MEDIA_MAX_UPLOAD_BYTES:10485760}
    thumbnail-max-width: ${VOYAGE_MEDIA_THUMB_MAX_W:400}
    thumbnail-max-height: ${VOYAGE_MEDIA_THUMB_MAX_H:400}
    # scaled：完整图按下列上限缩放；original：完整图保存原始字节
    full-variant: ${VOYAGE_MEDIA_FULL_VARIANT:scaled}
    full-max-width: ${VOYAGE_MEDIA_FULL_MAX_W:1600}
    full-max-height: ${VOYAGE_MEDIA_FULL_MAX_H:1600}

app:
  jwt:
    secret: ${JWT_SECRET:change_me_to_a_long_secret_for_prod}
    # Access：短期；Refresh：长期，到期后须重新登录
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  cors:
    # 多个域名用英文逗号分隔；生产环境请替换为正式前端域名
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
