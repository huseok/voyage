# 公共 Spring 配置；默认 profile 为 cloud，数据源见 application-cloud.yaml。
server:
  port: 8080

spring:
  application:
    name: voyage

  profiles:
    default: cloud

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: info
    com.trioForce.voyage: debug
    org.springframework.web: info
    org.hibernate.SQL: debug

app:
  jwt:
    secret: ${JWT_SECRET:change_me_to_a_long_secret_for_prod}
    access-token-minutes: 120
  cors:
    # 多个域名用英文逗号分隔；生产环境请替换为正式前端域名
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
