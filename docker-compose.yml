# 默认：仅 voyage-api + 远端库（cloud）。本地 Postgres 见 profile local-db + --env-file（DEPLOY.md §3.1）。
# ${...} 由 shell / .env / --env-file 替换；勿提交密钥。
services:
  db:
    profiles: ["local-db"]
    image: postgres:16
    container_name: voyage-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: voyage_db
      POSTGRES_USER: voyage_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - voyage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyage_user -d voyage_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  voyage-api:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: voyage-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-cloud}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0&preferQueryMode=simple}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres.xufviqcdhpncrdkyelrd}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_secret_for_prod}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  voyage_pg_data:
