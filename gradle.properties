# Kotlin 在 Gradle 进程内编译，减轻部分云构建（Kaniko）对 ~/.kotlin/daemon 快照时的竞态。
kotlin.compiler.execution.strategy=in-process

# CONFIGURING 长时间卡住常见原因：IPv6 路由异常（云上多见）、或 Gradle 在后台下载 JDK toolchain。
# 强制优先 IPv4，避免仓库/metadata 握手「假死」。
systemProp.java.net.preferIPv4Stack=true

# 未检测到已安装的 JDK 17 时直接报错，避免静默下载 JDK 十几二十分钟。
org.gradle.java.installations.auto-download=false

# 构建 JVM 内存（过小易 GC 抖动表现为卡住）；可按机器内存改为 1024m～2048m。
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
